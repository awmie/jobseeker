<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobSeeker · Remote Jobs</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com/@phosphor-icons/webcomponents@2.1.1"></script>
</head>
<body>
    <header>
        <div class="container">
            <button id="theme-toggle" class="theme-btn" onclick="toggleTheme()">
                <ph-moon id="theme-icon-moon"></ph-moon>
                <ph-sun id="theme-icon-sun" style="display:none"></ph-sun>
            </button>
            <h1>Job<span>Seeker</span></h1>
            <p class="subtitle">Find your next remote role</p>
        </div>
    </header>

    <main class="container">
        <div class="controls">
            <div class="search-box">
                <ph-magnifying-glass class="search-icon"></ph-magnifying-glass>
                <input type="text" id="search" placeholder="Search roles..." autocomplete="off">
            </div>
            <select id="category">
                <option value="">All Roles</option>
                <option value="software engineer">Software Engineer</option>
                <option value="ai engineer">AI Engineer</option>
                <option value="vibe coding">Vibe Coding</option>
                <option value="frontend">Frontend</option>
                <option value="backend">Backend</option>
                <option value="full stack">Full Stack</option>
                <option value="devops">DevOps</option>
                <option value="data">Data</option>
                <option value="machine learning">Machine Learning</option>
                <option value="product manager">Product Manager</option>
            </select>
            <select id="filter">
                <option value="">All Sources</option>
                <option value="WeWorkRemotely">WeWorkRemotely</option>
            </select>
<button id="refresh-btn" class="refresh-btn" onclick="triggerScrape()">
                <ph-arrows-clockwise></ph-arrows-clockwise>
                <span>Fetch</span>
            </button>
            <span id="count">Loading...</span>
        </div>

        <div id="jobs-container" class="jobs-grid">
            <div class="loading">Loading jobs...</div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>Updated: <span id="last-updated">-</span></p>
            <p class="credit">Auto-scraped via GitHub Actions</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
